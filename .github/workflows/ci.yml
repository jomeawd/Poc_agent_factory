name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ fast checks
  checks:
    name: Lint, unit tests, typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, curl, json
          tools: none

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint PHP files
        run: find api broker tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Unit and contract tests
        run: php tests/run.php

      - name: TypeScript typecheck (strict)
        working-directory: web
        run: |
          npm ci
          npx tsc -p tsconfig.json --noEmit

      - name: Shell scripts (shellcheck)
        run: shellcheck -S warning tests/integration/*.sh tests/e2e/*.sh

      - name: Compose file is valid
        run: docker compose config -q

  # ------------------------------------------------------------------ security
  security:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan

      - name: Secret scan (gitleaks, full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner

      - name: Dockerfile lint (hadolint)
        run: |
          for f in api broker web egress; do
            echo "::group::$f/Dockerfile"
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < "$f/Dockerfile"
            echo "::endgroup::"
          done

      - name: Misconfiguration scan (Trivy config)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml

      - name: Dependency vulnerabilities (Trivy fs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: npm audit (web)
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  # ------------------------------------------------------------------ images
  build:
    name: Build and scan ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api, broker, web, egress]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: agentfactory-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: agentfactory-${{ matrix.service }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ------------------------------------------------------------------ integration
  integration:
    name: Integration (real stack)
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PROJECT: afci
      ENV_FILE: /tmp/afci.env
    steps:
      - uses: actions/checkout@v4

      - name: Generate throwaway secrets
        run: tests/integration/gen-env.sh "$ENV_FILE"

      - name: Start the stack and wait for healthchecks
        run: docker compose -p "$PROJECT" --env-file "$ENV_FILE" up -d --build --wait --wait-timeout 300

      - name: Smoke suite (auth, CSRF/CORS, AgentFather, broker, isolation, egress, secrets)
        run: tests/integration/smoke.sh "$PROJECT" "$ENV_FILE"

      - name: Service logs on failure
        if: failure()
        run: docker compose -p "$PROJECT" --env-file "$ENV_FILE" logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose -p "$PROJECT" --env-file "$ENV_FILE" down -v --remove-orphans
